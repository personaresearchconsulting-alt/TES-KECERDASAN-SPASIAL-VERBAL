<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TES KECERDASAN SPASIAL VERBAL - Persona Research & Consulting</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0b2340;
            --gold: #d4a017;
            --ivory: #f8fafc;
            --white: #ffffff;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            background: var(--white);
            max-width: 480px;
            width: 90%;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border-top: 8px solid var(--navy);
            text-align: center;
        }
        .logo-text {
            color: var(--navy);
            font-weight: 900;
            font-size: 22px;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .status-box {
            background: var(--ivory);
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
            line-height: 1.5;
        }
        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: var(--navy);
        }
        .btn-access {
            background: var(--navy);
            color: var(--gold);
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .link-grid {
            display: none;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        .test-link {
            background: var(--ivory);
            padding: 15px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--navy);
            font-weight: 700;
            border: 1px solid #cbd5e1;
            transition: all 0.2s;
            font-size: 14px;
            text-align: left;
            display: flex;
            align-items: center;
        }
        .test-link:before {
            content: "▶";
            margin-right: 10px;
            font-size: 10px;
            color: var(--gold);
        }
        .test-link:hover {
            border-color: var(--gold);
            background: #fff;
            transform: translateX(5px);
        }
        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-text">TES KECERDASAN SPASIAL VERBAL</div>
    <div class="subtitle">Persona Research & Consulting</div>

    <div id="loginSection">
        <div class="status-box" id="msgBox">Silakan masukkan password akses untuk membuka modul tryout.</div>
        <input type="password" id="passInput" placeholder="Password Akses">
        <button class="btn-access" onclick="validateAccess()">BUKA MODUL</button>
    </div>

    <div id="linkSection" class="link-grid">
        <div class="status-box" style="background: #dcfce7; color: #166534; border-color: #bbf7d0;">
            <b>AKSES TERVERIFIKASI</b><br>
            Berlaku hingga: 01 Juli 2026
        </div>
        <a href="petunjuk pengerjaan.html" class="test-link">PANDUAN & PETUNJUK PENGERJAAN</a>
        <a href="kecedasan_4.html" class="test-link">CAT KECERDASAN (PAKET 4)</a>
    </div>

    <div class="footer">
        &copy; 2026 Persona Research & Consulting<br>
        WA: 0877 4251 5786
    </div>
</div>

<script>
    const CONFIG = {
        pass: "pesona05",
        expiryDate: "2026-07-01",
        storageKey: "prc_spasial_verbal_session"
    };

    function validateAccess() {
        const input = document.getElementById('passInput').value;
        const now = new Date();
        const expiry = new Date(CONFIG.expiryDate);

        if (now > expiry) {
            alert("Masa berlaku akses telah berakhir (1 Juli 2026).");
            return;
        }

        if (input === CONFIG.pass) {
            localStorage.setItem(CONFIG.storageKey, "authorized");
            showMenu();
        } else {
            alert("Password salah. Silakan periksa kembali.");
        }
    }

    function showMenu() {
        document.getElementById('loginSection').style.display = "none";
        document.getElementById('linkSection').style.display = "grid";
    }

    window.onload = function() {
        const now = new Date();
        const expiry = new Date(CONFIG.expiryDate);

        if (now > expiry) {
            document.getElementById('msgBox').innerHTML = "<b style='color:red'>BATCH EXPIRED</b><br>Akses telah ditutup secara otomatis.";
            document.getElementById('passInput').style.display = "none";
            document.querySelector('.btn-access').style.display = "none";
        } else if (localStorage.getItem(CONFIG.storageKey) === "authorized") {
            showMenu();
        }
    };
</script>

</body>
</html>
